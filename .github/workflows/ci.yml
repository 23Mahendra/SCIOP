name: SCIOP CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lovable-app:
    name: Lovable React app — build, test and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lovable-app
    env:
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      SUPABASE_PROJECT_ID: ci-placeholder
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      VITE_SUPABASE_PROJECT_ID: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run test
      - run: bun run typecheck
      - run: bun run lint

  legacy-api:
    name: Legacy Node API — syntax and frontend check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run check
      - name: Compile legacy standalone frontend
        run: |
          node --input-type=module -e 'import fs from "node:fs"; import vm from "node:vm"; const h=fs.readFileSync("app.html","utf8"); const a=h.indexOf("<script>")+8; const b=h.indexOf("</script>",a); if(a<8||b<0) throw new Error("Inline script missing"); new vm.Script(h.slice(a,b)); console.log("Inline JavaScript syntax OK");'
