name: SCIOP CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sciop
          POSTGRES_PASSWORD: sciop_test_only
          POSTGRES_DB: sciop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sciop -d sciop_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://sciop:sciop_test_only@localhost:5432/sciop_test
      JWT_SECRET: test-secret-0123456789-0123456789-0123456789
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run check
      - name: Compile inline application JavaScript
        run: |
          node --input-type=module -e 'import fs from "node:fs"; import vm from "node:vm"; const h=fs.readFileSync("app.html","utf8"); const a=h.indexOf("<script>")+8; const b=h.indexOf("</script>",a); if(a<8||b<0) throw new Error("Inline script missing"); new vm.Script(h.slice(a,b)); console.log("Inline JavaScript syntax OK");'
      - name: Apply schema to PostgreSQL
        run: PGPASSWORD=sciop_test_only psql -v ON_ERROR_STOP=1 -h localhost -U sciop -d sciop_test -f server/schema.sql
      - name: Verify API health
        run: |
          node server/server-fixed.js > /tmp/sciop.log 2>&1 &
          echo $! > /tmp/sciop.pid
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:3000/api/health && break || sleep 2; done
          curl -fsS http://127.0.0.1:3000/api/config
          kill $(cat /tmp/sciop.pid)
