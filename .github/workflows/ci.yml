name: SCIOP CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sciop
          POSTGRES_PASSWORD: sciop_test_only
          POSTGRES_DB: sciop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sciop -d sciop_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://sciop:sciop_test_only@localhost:5432/sciop_test
      JWT_SECRET: test-secret-0123456789-0123456789-0123456789
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm run check
      - name: Compile inline application JavaScript
        run: |
          node --input-type=commonjs -e "const fs=require('fs'); const vm=require('vm'); const h=fs.readFileSync('app.html','utf8'); const ss=[...h.matchAll(/<script>([\s\S]*?)<\\/script>/g)]; if(!ss.length) throw new Error('No inline script found'); ss.forEach((x,i)=>new vm.Script(x[1],{filename:'app-inline-'+i+'.js'})); console.log('Compiled',ss.length,'inline script(s)');"
      - name: Apply schema to PostgreSQL
        run: PGPASSWORD=sciop_test_only psql -v ON_ERROR_STOP=1 -h localhost -U sciop -d sciop_test -f server/schema.sql
      - name: Verify API health and auth routes
        run: |
          node server/server.js > /tmp/sciop.log 2>&1 &
          echo $! > /tmp/sciop.pid
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:3000/api/health && break || sleep 2; done
          curl -fsS http://127.0.0.1:3000/api/config
          kill $(cat /tmp/sciop.pid)
